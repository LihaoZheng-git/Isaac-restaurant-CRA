[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [
    "outputs",
    "scenes/generated",
]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
]

[tool.ruff.lint.per-file-ignores]
# Standalone Isaac scripts intentionally create SimulationApp before
# importing other Isaac Sim and project runtime modules.
"experiment/runtime/service_phase.py" = ["E402"]
"experiment/runtime/isaac_session.py" = ["E402"]
