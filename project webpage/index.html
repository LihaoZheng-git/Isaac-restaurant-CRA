<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Anonymous review materials for Continuous Risk Assessment for Safety-critical Visual Navigation.">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>CRA: Continuous Risk Assessment for Safety-critical Visual Navigation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
  <link rel="stylesheet" href="styles.css">
  <script src="content.js" defer></script>
  <script src="page.js" defer></script>
</head>
<body>
  <header class="paper-heading wrap">
    <div class="paper-copy">
      <h1 class="paper-title" data-copy="title"></h1>
      <a class="repository-link" href="https://github.com/LihaoZheng-git/Isaac-restaurant-CRA">
        <svg width="22" height="22" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true" focusable="false">
          <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/>
        </svg>
        <span data-copy="repository">View on GitHub</span>
        <svg class="repository-arrow" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true" focusable="false">
          <path d="M4 12 12 4M4.5 4H12v7.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>
    </div>
    <img class="media highlight" src="media/restaurant-highlight.gif" width="640" height="360"
      alt="Highlights of Carter navigating the restaurant and delivering food.">
  </header>

  <main class="wrap">
    <section class="page-section abstract-section" aria-labelledby="abstract-title">
      <h2 id="abstract-title" data-copy="abstractTitle"></h2>
      <p class="abstract" data-copy="abstract"></p>
    </section>

    <section class="page-section" aria-labelledby="pipeline-title">
      <h2 id="pipeline-title" data-copy="pipeline"></h2>
      <img class="media pipeline" src="media/pipeline.png" width="2100" height="1288" loading="lazy"
        alt="CRA research pipeline linking scene observations, physical cues, risk assessment, and navigation control.">
    </section>

    <section class="page-section results" aria-labelledby="results-title">
      <h2 id="results-title" data-copy="results"></h2>
      <section class="result-card result-wide" aria-labelledby="restaurant-title">
        <h3 id="restaurant-title" data-copy="restaurant"></h3>
        <p class="caption intro" data-copy="restaurantNote"></p>
        <video class="media" src="demo%20result/restaurant.mp4" controls playsinline preload="metadata"
          width="1920" height="1080" aria-labelledby="restaurant-title"></video>
      </section>

      <section class="result-card" aria-labelledby="speed-title">
        <h3 id="speed-title" data-copy="speed"></h3>
        <img class="media" src="media/running-boy.gif" width="640" height="360" loading="lazy"
          alt="Carter yields as a running boy crosses its route in the restaurant.">
      </section>

      <section class="result-card" aria-labelledby="aggregation-title">
        <h3 id="aggregation-title" data-copy="aggregation"></h3>
        <img class="media" src="media/hot-pot-sample.gif" width="704" height="528" loading="lazy"
          alt="Carter approaches a person carrying a hot pot in the restaurant." aria-describedby="aggregation-note">
        <p class="caption" id="aggregation-note" data-copy="aggregationNote"></p>
      </section>

      <section class="result-card result-wide" aria-labelledby="hole-title">
        <h3 id="hole-title" data-copy="hole"></h3>
        <img class="media" src="media/warehouse-hole.gif" width="960" height="384" loading="lazy"
          alt="Carter changes course to go around an opening in the warehouse floor.">
      </section>
    </section>

    <section class="page-section" aria-labelledby="references-title">
      <h2 id="references-title">References</h2>
      <p class="caption">The demos are built using <a href="https://developer.nvidia.com/isaac/sim/">NVIDIA Isaac Sim</a>.</p>
    </section>
  </main>
</body>
</html>
