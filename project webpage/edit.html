<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Edit CRA project page</title>
  <link rel="stylesheet" href="styles.css">
  <script src="content.js" defer></script>
  <script src="page.js" defer></script>
</head>
<body>
  <main class="wrap editor">
    <h1>Edit the project page</h1>
    <p class="editor-intro">Save a draft to preview your edits in this browser. Download <code>content.js</code> to update the website source.</p>
    <form id="edit-form">
      <div id="edit-fields"></div>
      <div class="actions">
        <button type="submit">Save draft and preview</button>
        <button id="download-content" type="button">Download content.js</button>
        <a href="index.html">Open saved site</a>
      </div>
      <p class="status" id="edit-status" role="status"></p>
    </form>
  </main>
</body>
</html>
